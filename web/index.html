<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b22">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wowfy</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">W</div>
        <div><strong>Wowfy</strong><span>Food, made wow.</span></div>
      </div>
      <button class="icon-btn" aria-label="Location">⌖</button>
    </header>

    <main>
      <section class="search">
        <span>⌕</span><input aria-label="Search food" placeholder="Search food, restaurants..." />
      </section>

      <section class="hero">
        <div>
          <small>Hungry?</small>
          <h1>Good food.<br><b>Good mood.</b></h1>
          <p>Discover tasty meals near you.</p>
          <button class="primary">Order now</button>
        </div>
        <div class="food-emoji">🍔</div>
      </section>

      <section>
        <div class="section-head"><h2>Categories</h2><a>See all</a></div>
        <div class="categories">
          <button><i>🍔</i>Burgers</button>
          <button><i>🍕</i>Pizza</button>
          <button><i>🍜</i>Noodles</button>
          <button><i>🥗</i>Healthy</button>
          <button><i>🍰</i>Dessert</button>
        </div>
      </section>

      <section>
        <div class="section-head"><h2>Popular near you</h2><a>See all</a></div>
        <div class="cards">
          <article class="card"><div class="photo burger">🍔</div><h3>Wow Burger</h3><p>Classic beef burger</p><div><b>₹199</b><span>★ 4.8</span></div></article>
          <article class="card"><div class="photo pizza">🍕</div><h3>Cheesy Pizza</h3><p>Fresh & extra cheesy</p><div><b>₹249</b><span>★ 4.7</span></div></article>
          <article class="card"><div class="photo bowl">🍜</div><h3>Hot Noodles</h3><p>Spicy street noodles</p><div><b>₹159</b><span>★ 4.6</span></div></article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active"><span>⌂</span>Home</button>
      <button><span>♡</span>Favorites</button>
      <button><span>🛍</span>Orders</button>
      <button><span>◉</span>Profile</button>
    </nav>
  </div>
</body>
</html>
